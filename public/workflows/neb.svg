<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="neb-title neb-desc">
  <title id="neb-title">Nudged elastic band</title>
  <desc id="neb-desc">A reaction path between two minima, discretized into a band of images connected by springs; the images cluster near the barrier, and the highest-energy image (the climbing image, ringed) is driven to converge exactly on the saddle point rather than merely relaxing toward it.</desc>
  <style>
    .axis{stroke:var(--color-border-emphasis, #D8D2C6);stroke-width:1;}
    .curve{stroke:var(--color-data-blue, #4477AA);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .spring{stroke:var(--color-text-muted, #8A8478);stroke-width:1;stroke-dasharray:1.5 2;}
    .image{fill:var(--color-data-cyan, #66CCEE);stroke:var(--color-data-blue, #4477AA);stroke-width:1.2;}
    .climb{fill:var(--color-bg-elevated, #FFFFFF);stroke:var(--color-accent-strong, #3A7A40);stroke-width:2.2;}
    .end{fill:var(--color-text-primary, #262521);}
    .cap{fill:var(--color-text-muted, #8A8478);font-family:ui-monospace,"Geist Mono",monospace;font-size:8.5px;}
  </style>

  <line class="axis" x1="20" y1="113" x2="260" y2="113"/>

  <polyline class="curve" points="20.0,77.1 24.1,77.7 28.1,78.3 32.2,78.8 36.3,79.3 40.3,79.8 44.4,80.1 48.5,80.4 52.5,80.4 56.6,80.2 60.7,79.6 64.7,78.6 68.8,77.0 72.9,74.8 76.9,71.9 81.0,68.3 85.1,63.8 89.2,58.6 93.2,52.8 97.3,46.5 101.4,40.1 105.4,33.9 109.5,28.3 113.6,23.6 117.6,20.1 121.7,18.2 125.8,18.0 129.8,19.6 133.9,22.8 138.0,27.6 142.0,33.6 146.1,40.5 150.2,48.0 154.2,55.6 158.3,63.0 162.4,70.0 166.4,76.4 170.5,82.0 174.6,86.8 178.6,90.9 182.7,94.2 186.8,97.0 190.8,99.1 194.9,100.9 199.0,102.3 203.1,103.5 207.1,104.5 211.2,105.3 215.3,106.1 219.3,106.8 223.4,107.5 227.5,108.1 231.5,108.7 235.6,109.3 239.7,110.0 243.7,110.6 247.8,111.2 251.9,111.8 255.9,112.4 260.0,113.0"/>

  <!-- inter-image springs -->
  <line class="spring" x1="20.0" y1="77.1" x2="58.4" y2="80.0"/>
  <line class="spring" x1="58.4" y1="80.0" x2="92.0" y2="54.6"/>
  <line class="spring" x1="92.0" y1="54.6" x2="125.6" y2="18.0"/>
  <line class="spring" x1="125.6" y1="18.0" x2="164.0" y2="72.6"/>
  <line class="spring" x1="164.0" y1="72.6" x2="207.2" y2="104.5"/>
  <line class="spring" x1="207.2" y1="104.5" x2="260.0" y2="113.0"/>

  <circle class="end" cx="20.0" cy="77.1" r="4"/>
  <circle class="image" cx="58.4" cy="80.0" r="3.4"/>
  <circle class="image" cx="92.0" cy="54.6" r="3.4"/>
  <circle class="climb" cx="125.6" cy="18.0" r="4.6"/>
  <circle class="image" cx="164.0" cy="72.6" r="3.4"/>
  <circle class="image" cx="207.2" cy="104.5" r="3.4"/>
  <circle class="end" cx="260.0" cy="113.0" r="4"/>

  <text class="cap" x="98" y="10">climbing image</text>
  <text class="cap" x="20" y="128">reactant</text>
  <text class="cap" x="230" y="128">product</text>
</svg>
