<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="md-title md-desc">
  <title id="md-title">Molecular dynamics</title>
  <desc id="md-desc">An atom wandering under a Langevin thermostat, its path fading from a faint start to its current position, next to the instantaneous-temperature trace fluctuating around the NVT target temperature.</desc>
  <defs>
    <marker id="md-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--color-accent-strong, #3A7A40)"/>
    </marker>
  </defs>
  <style>
    .path{stroke:var(--color-text-muted, #8A8478);stroke-width:1.4;fill:none;opacity:0.55;stroke-linecap:round;stroke-linejoin:round;}
    .dot{fill:var(--color-text-secondary, #5C574E);}
    .now{fill:var(--color-accent-strong, #3A7A40);}
    .vel{stroke:var(--color-accent-strong, #3A7A40);stroke-width:1.4;stroke-linecap:round;}
    .temp{stroke:var(--color-data-red, #EE6677);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .target{stroke:var(--color-text-muted, #8A8478);stroke-width:1;stroke-dasharray:2 2.5;}
    .frame{stroke:var(--color-border-subtle, #EAE6DD);stroke-width:1;fill:none;}
    .cap{fill:var(--color-text-muted, #8A8478);font-family:ui-monospace,"Geist Mono",monospace;font-size:8.5px;}
  </style>

  <rect class="frame" x="10" y="15" width="90" height="80" rx="4"/>

  <!-- wandering trajectory -->
  <polyline class="path" points="54.3,65.5 55.3,66.4 54.8,64.5 54.1,60.8 54.1,57.7 54.6,56.4 54.6,57.0 53.5,57.4 51.6,56.4 50.1,54.1 50.1,51.7 51.4,50.8 53.0,51.2 53.0,51.3 50.5,49.6 45.9,46.6 40.8,44.1 36.9,44.0 34.9,46.8 34.4,51.0 34.3,54.8 34.0,57.4 33.9,59.5 35.1,62.4 38.0,66.1 42.3,69.1 46.2,69.5 48.4,66.6 48.2,61.7 46.7,57.0 45.6,54.1 46.2,52.5 48.6,50.9 51.7,48.4 54.2,45.8 55.5,44.8 55.9,46.3 56.5,49.5 57.5,52.2 58.4,52.9"/>
  <circle class="dot" cx="54.3" cy="65.5" r="1.6" opacity="0.15"/>
  <circle class="dot" cx="54.6" cy="56.4" r="1.6" opacity="0.26"/>
  <circle class="dot" cx="50.1" cy="51.7" r="1.6" opacity="0.36"/>
  <circle class="dot" cx="45.9" cy="46.6" r="1.6" opacity="0.47"/>
  <circle class="dot" cx="34.3" cy="54.8" r="1.6" opacity="0.58"/>
  <circle class="dot" cx="42.3" cy="69.1" r="1.6" opacity="0.69"/>
  <circle class="dot" cx="45.6" cy="54.1" r="1.6" opacity="0.79"/>
  <circle class="dot" cx="55.5" cy="44.8" r="1.6" opacity="0.9"/>
  <line class="vel" x1="61.6" y1="55.4" x2="67.9" y2="60.3" marker-end="url(#md-arrow)"/>
  <circle class="now" cx="58.4" cy="52.9" r="4"/>

  <!-- temperature trace -->
  <line class="target" x1="118" y1="118.2" x2="268" y2="118.2"/>
  <polyline class="temp" points="118.0,108.5 121.8,110.1 125.7,109.8 129.5,107.1 133.4,106.7 137.2,110.1 141.1,112.7 144.9,110.5 148.8,107.0 152.6,109.7 156.5,120.5 160.3,132.2 164.2,137.4 168.0,136.1 171.8,133.5 175.7,132.0 179.5,127.8 183.4,118.7 187.2,109.3 191.1,106.7 194.9,111.0 198.8,114.9 202.6,112.3 206.5,106.1 210.3,103.2 214.2,105.9 218.0,110.0 221.8,112.3 225.7,115.8 229.5,124.6 233.4,136.0 237.2,141.8 241.1,137.6 244.9,128.3 248.8,122.0 252.6,120.5 256.5,119.0 260.3,114.5 264.2,110.4 268.0,110.7"/>

  <text class="cap" x="14" y="105">trajectory</text>
  <text class="cap" x="118" y="95">T fluctuates (NVT)</text>
</svg>
