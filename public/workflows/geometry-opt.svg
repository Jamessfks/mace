<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="go-title go-desc">
  <title id="go-title">Geometry optimization</title>
  <desc id="go-desc">A distorted starting geometry (dashed outline) relaxing toward a stable minimum (solid) under BFGS, alongside the RMS-force convergence curve dropping below the fmax threshold where the run is accepted as converged.</desc>
  <defs>
    <marker id="go-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--color-accent-strong, #3A7A40)"/>
    </marker>
  </defs>
  <style>
    .ghostBond{stroke:var(--color-border-emphasis, #D8D2C6);stroke-width:1.6;stroke-dasharray:3.5 3;fill:none;}
    .ghostAtom{fill:none;stroke:var(--color-text-muted, #8A8478);stroke-width:1.3;stroke-dasharray:2.5 2.5;}
    .bond{stroke:var(--color-text-secondary, #5C574E);stroke-width:2.4;stroke-linecap:round;}
    .atomO{fill:var(--color-data-red, #EE6677);}
    .atomH{fill:var(--color-bg-elevated, #FFFFFF);stroke:var(--color-text-secondary, #5C574E);stroke-width:1.3;}
    .step{stroke:var(--color-accent-strong, #3A7A40);stroke-width:1.3;stroke-linecap:round;fill:none;opacity:0.85;}
    .curve{stroke:var(--color-data-blue, #4477AA);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .pt{fill:var(--color-data-cyan, #66CCEE);stroke:var(--color-data-blue, #4477AA);stroke-width:1;}
    .converged{fill:var(--color-bg-elevated, #FFFFFF);stroke:var(--color-accent-strong, #3A7A40);stroke-width:2;}
    .thresh{stroke:var(--color-text-muted, #8A8478);stroke-width:1;stroke-dasharray:2 2.5;}
    .cap{fill:var(--color-text-muted, #8A8478);font-family:ui-monospace,"Geist Mono",monospace;font-size:8.5px;}
  </style>

  <!-- ghost (initial, distorted) geometry -->
  <line class="ghostBond" x1="72" y1="26" x2="118" y2="52"/>
  <line class="ghostBond" x1="72" y1="26" x2="10" y2="96"/>
  <circle class="ghostAtom" cx="72" cy="26" r="6.5"/>
  <circle class="ghostAtom" cx="118" cy="52" r="4.4"/>
  <circle class="ghostAtom" cx="10" cy="96" r="4.4"/>

  <!-- optimization step arrows -->
  <line class="step" x1="72" y1="26" x2="58.8" y2="46.8" marker-end="url(#go-arrow)"/>
  <line class="step" x1="118" y1="52" x2="95.0" y2="74.7" marker-end="url(#go-arrow)"/>
  <line class="step" x1="10" y1="96" x2="16.4" y2="85.6" marker-end="url(#go-arrow)"/>

  <!-- final (relaxed) geometry -->
  <line class="bond" x1="55" y1="52.7" x2="90" y2="79.6"/>
  <line class="bond" x1="55" y1="52.7" x2="20" y2="79.6"/>
  <circle class="atomO" cx="55" cy="52.7" r="7"/>
  <circle class="atomH" cx="90" cy="79.6" r="4.8"/>
  <circle class="atomH" cx="20" cy="79.6" r="4.8"/>

  <!-- RMS-force convergence curve -->
  <line class="thresh" x1="118" y1="65.1" x2="268" y2="65.1"/>
  <text class="cap" x="120" y="62.5">fmax</text>
  <polyline class="curve" points="118,14 133,29.2 148,26.4 163,45.8 178,43 193,56.8 208,62.3 223,66.3 238,68.7 253,70.3 268,71.2"/>
  <circle class="pt" cx="118" cy="14" r="2.3"/>
  <circle class="pt" cx="133" cy="29.2" r="2.3"/>
  <circle class="pt" cx="148" cy="26.4" r="2.3"/>
  <circle class="pt" cx="163" cy="45.8" r="2.3"/>
  <circle class="pt" cx="178" cy="43" r="2.3"/>
  <circle class="pt" cx="193" cy="56.8" r="2.3"/>
  <circle class="pt" cx="208" cy="62.3" r="2.3"/>
  <circle class="converged" cx="223" cy="66.3" r="3.4"/>
  <circle class="pt" cx="238" cy="68.7" r="2.3"/>
  <circle class="pt" cx="253" cy="70.3" r="2.3"/>
  <circle class="pt" cx="268" cy="71.2" r="2.3"/>

  <text class="cap" x="118" y="164">RMS force vs. BFGS step</text>
</svg>
