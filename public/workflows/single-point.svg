<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Single-point energy and forces</title>
  <desc id="sp-desc">Ethane (C2H6) with per-atom MACE force vectors, drawn from a real calculation: two carbons bonded along the horizontal axis, six hydrogens around them, and a green arrow on every atom showing the direction and relative size of the force MACE predicted at that geometry.</desc>
  <defs>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--color-accent-strong, #3A7A40)"/>
    </marker>
  </defs>
  <style>
    .bond{stroke:var(--color-border-emphasis, #D8D2C6);stroke-width:2.4;stroke-linecap:round;}
    .atomC{fill:var(--color-text-primary, #262521);}
    .atomH{fill:var(--color-bg-elevated, #FFFFFF);stroke:var(--color-text-secondary, #5C574E);stroke-width:1.3;}
    .force{stroke:var(--color-accent-strong, #3A7A40);stroke-width:1.6;stroke-linecap:round;fill:none;}
    .cap{fill:var(--color-text-muted, #8A8478);font-family:ui-monospace,"Geist Mono",monospace;font-size:9px;}
  </style>

  <!-- bonds -->
  <line class="bond" x1="107.7" y1="95.7" x2="172.3" y2="94.5"/>
  <line class="bond" x1="107.7" y1="95.7" x2="89.9" y2="53.9"/>
  <line class="bond" x1="107.7" y1="95.7" x2="91.5" y2="113.1"/>
  <line class="bond" x1="107.7" y1="95.7" x2="90.9" y2="121.2"/>
  <line class="bond" x1="172.3" y1="94.5" x2="188.4" y2="52.0"/>
  <line class="bond" x1="172.3" y1="94.5" x2="190.0" y2="111.3"/>
  <line class="bond" x1="172.3" y1="94.5" x2="189.4" y2="119.2"/>

  <!-- force vectors (amplified for visibility, direction and relative magnitude are real) -->
  <line class="force" x1="107.7" y1="95.7" x2="91.9" y2="93.7" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="172.3" y1="94.5" x2="188.2" y2="97.4" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="89.9" y1="53.9" x2="103.6" y2="34.8" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="91.5" y1="113.1" x2="113.5" y2="124.1" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="90.9" y1="121.2" x2="95.2" y2="131.3" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="188.4" y1="52.0" x2="173.9" y2="30.4" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="190.0" y1="111.3" x2="186.0" y2="116.0" marker-end="url(#sp-arrow)"/>
  <line class="force" x1="189.4" y1="119.2" x2="167.9" y2="133.2" marker-end="url(#sp-arrow)"/>

  <!-- atoms (drawn after vectors so the dots sit on top of the arrow tails) -->
  <circle class="atomC" cx="107.7" cy="95.7" r="7.5"/>
  <circle class="atomC" cx="172.3" cy="94.5" r="7.5"/>
  <circle class="atomH" cx="89.9" cy="53.9" r="4.6"/>
  <circle class="atomH" cx="91.5" cy="113.1" r="4.6"/>
  <circle class="atomH" cx="90.9" cy="121.2" r="4.6"/>
  <circle class="atomH" cx="188.4" cy="52.0" r="4.6"/>
  <circle class="atomH" cx="190.0" cy="111.3" r="4.6"/>
  <circle class="atomH" cx="189.4" cy="119.2" r="4.6"/>

  <text class="cap" x="14" y="166">E = -2173.35 eV</text>
</svg>
